server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/${POSTGRES_DB:postgres}?reWriteBatchedInserts=true
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  application:
    name: ai-agent
  kafka:
    bootstrap-servers: localhost:19092,localhost:29092,localhost:39092
  jpa:
    show-sql: true
    properties:
      hibernate:
        jdbc:
          batch_size: 100
        order_inserts: true
  data:
    redis:
      cluster:
        nodes:
          - 127.0.0.1:7001
          - 127.0.0.1:7002
          - 127.0.0.1:7003
      lettuce:
        cluster:
          refresh:
            adaptive: true
            period: 10s
app:
  scheduled:
    cron:
      AiAgentKafkaOutboxWorker_refreshOutboxTable: "0 */2 * * * *"
      AIAgentKafkaIdempotencyScheduler_cleanUp: "0 0 * * * *"
      GroupingOutboxScheduler_refreshProcessingLinkUpdateTable: "0 */2 * * * *"
  schedulerLock:
    lockAtMostFor:
      GroupingOutboxScheduler_groupAndMoveToOutbox: 25s
      AIAgentKafkaIdempotencyScheduler_cleanUp: 10m
      AiAgentKafkaOutboxWorker_sendToKafka: 50s
      GroupingOutboxScheduler_refreshProcessingLinkUpdateTable: 100s
      AiAgentKafkaOutboxWorker_refreshOutboxTable: 100s

    lockAtLeastFor:
      GroupingOutboxScheduler_groupAndMoveToOutbox: 5s
      AIAgentKafkaIdempotencyScheduler_cleanUp: 3m
      AiAgentKafkaOutboxWorker_sendToKafka: 10s
      GroupingOutboxScheduler_refreshProcessingLinkUpdateTable: 20s
      AiAgentKafkaOutboxWorker_refreshOutboxTable: 20s



  kafka:
    schema-registry: http://localhost:9093
    consumer:
      retry:
        attempts: 3
        interval: 3000
      concurrency: 3
      group-id: "agent-fresh-group-v1"
      topic:
#        name: link.raw-updates
         name: order.outbox
    producer:
      send-delay: 60s
      topic:
        name: link.processed-updates
        partitions: 3
        replicas: 3
      outbox:
        max-retries: 5
        delay: 120s
        max-batches: 10
        batch-send-size: 500
        batch-clean-size: 5000
        batch-take-size: 5000
      min-insync-replicas: 2
  filtering:
    stop-words:
      - spam
      - ads
      - promo
    excluded-authors:
      - self
    min-length: 250
  summarization:
    threshold: 500
  yandexgpt:
    api-key: ${YANDEXGPT_API_KEY}
    folder-id: ${YANDEXGPT_FOLDER_ID}
    uri: https://llm.api.cloud.yandex.net
  prioritization:
    high-keywords:
      - critical
      - urgent
      - breaking
      - security
    low-keywords:
      - minor
      - typo
      - chore
      - docs
  grouping:
    window-ms: 30000

logging:
  cache:
    limit: 4096
  ai-agent:
    masking:
      http:
        headers:
          - Authorization
        keys: []
      yandex:
        headers:
          - Authorization
          - x-folder-id
        keys: []

management:
  server:
    port: 8013
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,threaddump
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  otlp:
    metrics:
      export:
        enabled: false
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
          transport: http
