server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/${POSTGRES_DB:postgres}?reWriteBatchedInserts=true
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  application:
    name: ai-agent
  kafka:
    bootstrap-servers: localhost:19092,localhost:29092,localhost:39092
  jpa:
    show-sql: true
    properties:
      hibernate:
        jdbc:
          batch_size: 100
        order_inserts: true
app:
  kafka:
    schema-registry: http://localhost:9093
    consumer:
      retry:
        attempts: 3
        interval: 3000
      concurrency: 3
      group-id: "agent-fresh-group-v1"
      topic:
        name: link.raw-updates
    producer:
      send-delay: 60s
      topic:
        name: link.processed-updates
        partitions: 3
        replicas: 3
      outbox:
        max-retries: 5
        delay: 120s
        max-batches: 10
        batch-send-size: 500
        batch-clean-size: 5000
        batch-take-size: 5000
      min-insync-replicas: 2
  filtering:
    stop-words:
      - spam
      - ads
      - promo
    excluded-authors:
      - self
    min-length: 250
  summarization:
    threshold: 500
  yandexgpt:
    api-key: ${YANDEXGPT_API_KEY}
    folder-id: ${YANDEXGPT_FOLDER_ID}
    uri: https://llm.api.cloud.yandex.net
  prioritization:
    high-keywords:
      - critical
      - urgent
      - breaking
      - security
    low-keywords:
      - minor
      - typo
      - chore
      - docs
  grouping:
    window-ms: 30000

logging:
  cache:
    limit: 4096
  ai-agent:
    masking:
      http:
        headers:
          - Authorization
        keys: []
      yandex:
        headers:
          - Authorization
          - x-folder-id
        keys: []

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  otlp:
    metrics:
      export:
        enabled: false
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
          transport: http
