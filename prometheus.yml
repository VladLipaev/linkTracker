global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'scrapper'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:8081']
        labels:
          application: 'scrapper'

  - job_name: 'bot'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:8011']
        labels:
          application: 'bot'

  - job_name: 'pushgateway'
    honor_labels: true
    static_configs:
      - targets: [ 'pushgateway:9091' ]
