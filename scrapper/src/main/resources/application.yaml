server:
  port: 8081

spring:
  application:
    name: scrapper
  grpc:
    server:
      port: 9081
    client:
      default-channel:
        address: 'static://localhost:9080'
        negotiation-type: plaintext
  datasource:
    url: jdbc:postgresql://localhost:5433/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    show-sql: true
app:
  stackoverflow:
    key: ${STACKOVERFLOW_KEY} # Use env variable. DO NOT KEEP TOKEN HERE
    access-token: ${STACKOVERFLOW_ACCESS_KEY} # Use env variable. DO NOT KEEP TOKEN HERE
  github:
    token: ${GITHUB_TOKEN} # Use env variable. DO NOT KEEP TOKEN HERE
  bot:
    uri: http://localhost:8080
  scheduler:
    interval: 30s
  communication:
    mode: grpc # rest
  db:
    access-type: ORM


logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %clr(%-5level) %clr([%thread]){magenta} %clr(%logger{36}){cyan} - %msg %clr(%kvp){yellow}%n"
  level:
    root: INFO
