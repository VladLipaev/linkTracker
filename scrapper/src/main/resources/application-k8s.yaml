spring:
  datasource:
    url: jdbc:postgresql://postgres-db-svc:5432/${POSTGRES_DB:postgres}?reWriteBatchedInserts=true
  kafka:
    bootstrap-servers: kafka-0.kafka-hs:9092,kafka-1.kafka-hs:9092,kafka-2.kafka-hs:9092
  data:
    redis:
      cluster:
        nodes:
          - valkey-0.valkey-hs:6379
          - valkey-1.valkey-hs:6379
          - valkey-2.valkey-hs:6379
          - valkey-3.valkey-hs:6379
          - valkey-4.valkey-hs:6379
          - valkey-5.valkey-hs:6379
app:
  kafka:
    schema-registry: http://schema-registry-svc:9093
  bot:
    uri: http://bot-svc:8080

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,info,prometheus
      path-mapping:
        prometheus: metrics
  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
    export:
      prometheus:
        enabled: true
        pushgateway:
          enabled: true
          base-url: http://pushgateway-svc:9091
          push-rate: 30s
          job: ${spring.application.name}
  health:
    kafka:
      enabled: false
    redis:
      enabled: false
    db:
      enabled: true

