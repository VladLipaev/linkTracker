syntax = "proto3";

package backend.academy.linktracker;

option java_multiple_files = true;
option java_package = "backend.academy.linktracker.grpc.bot";

import "google/protobuf/empty.proto";

service BotUpdateService {
    rpc SendUpdate (LinkUpdateRequest) returns (google.protobuf.Empty);
}

message LinkUpdateRequest {
    int64 id = 1;
    string url = 2;
    string description = 3;
    repeated int64 tg_chat_ids = 4;
}
