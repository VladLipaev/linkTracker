apiVersion: batch/v1
kind: Job
metadata:
  name: valkey-cluster-init
spec:
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-valkey
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              for i in 0 1 2 3 4 5; do
                until nc -z valkey-${i}.valkey-hs 6379; do
                  echo "Waiting for valkey-${i}...";
                  sleep 2;
                done;
              done
      containers:
        - name: init-cluster
          image: valkey/valkey:latest
          command:
            - sh
            - -c
            - |
              echo "Creating cluster..."
              valkey-cli --cluster create \
                valkey-0.valkey-hs:6379 \
                valkey-1.valkey-hs:6379 \
                valkey-2.valkey-hs:6379 \
                valkey-3.valkey-hs:6379 \
                valkey-4.valkey-hs:6379 \
                valkey-5.valkey-hs:6379 \
                --cluster-replicas 1 --cluster-yes || echo "Cluster already initialized"
