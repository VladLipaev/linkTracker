apiVersion: v1
kind: Service
metadata:
  name: kafka-hs
spec:
  clusterIP: None
  ports:
    - port: 9092
      name: internal
  selector:
    app: kafka
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
spec:
  serviceName: kafka-hs
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      initContainers:
        - name: wait-for-zookeeper
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z zookeeper-hs 2181; do echo waiting for zookeeper; sleep 2; done']
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.5.0
          ports:
            - containerPort: 9092
              name: internal
          env:
            - name: KAFKA_CLUSTER_ID
              value: "linktracker-k8s-dev"
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: zookeeper-hs:2181
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: INTERNAL:PLAINTEXT
            - name: KAFKA_LISTENERS
              value: INTERNAL://0.0.0.0:9092
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: INTERNAL
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "3"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "3"
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data
            - name: KAFKA_HEAP_OPTS
              value: "-Xmx512M -Xms512M"
          command:
            - sh
            - -c
            - |
              export KAFKA_BROKER_ID=${HOSTNAME##*-}
              export KAFKA_ADVERTISED_LISTENERS=INTERNAL://${HOSTNAME}.kafka-hs:9092
              echo "Starting Kafka broker ${KAFKA_BROKER_ID}"
              echo "Advertised listeners: ${KAFKA_ADVERTISED_LISTENERS}"
              /etc/confluent/docker/run
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
