apiVersion: apps/v1
kind: Deployment
metadata:
  name: linktracker-scrapper
  labels:
    app: linktracker-scrapper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: linktracker-scrapper
  template:
    metadata:
      labels:
        app: linktracker-scrapper
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres-db-svc 5432; do echo waiting for postgres; sleep 2; done']
        - name: wait-for-kafka
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z kafka-0.kafka-hs 9092; do echo waiting for kafka; sleep 2; done']
        - name: wait-for-valkey
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z valkey-0.valkey-hs 6379; do echo waiting for valkey; sleep 2; done']
      containers:
        - name: linktracker-scrapper
          image: linktracker/scrapper:0.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: http
            - containerPort: 8012
              name: management
          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  key: SPRING_PROFILES_ACTIVE
                  name: app-config
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
            - name: POSTGRES_DB
              value: postgres
            - name: STACKOVERFLOW_KEY
              valueFrom:
                secretKeyRef:
                  name: linktracker-secrets
                  key: STACKOVERFLOW_KEY
            - name: STACKOVERFLOW_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: linktracker-secrets
                  key: STACKOVERFLOW_ACCESS_KEY
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: linktracker-secrets
                  key: GITHUB_TOKEN
---
apiVersion: v1
kind: Service
metadata:
  name: scrapper-svc
  labels:
    app: linktracker-scrapper
spec:
  type: NodePort
  selector:
    app: linktracker-scrapper
  ports:
    - port: 8081
      targetPort: 8081
      nodePort: 30081
      name: http
    - port: 8012
      targetPort: 8012
      nodePort: 30012
      name: management
