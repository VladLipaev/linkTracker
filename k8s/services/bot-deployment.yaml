apiVersion: apps/v1
kind: Deployment
metadata:
  name: linktracker-bot
  labels:
    app: linktracker-bot
spec:
  selector:
    matchLabels:
      app: linktracker-bot
  template:
    metadata:
      labels:
        app: linktracker-bot
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres-db-svc 5432; do echo waiting for postgres; sleep 2; done']
        - name: wait-for-kafka
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z kafka-0.kafka-hs 9092; do echo waiting for kafka; sleep 2; done']
      containers:
        - name: linktracker-bot
          image: linktracker/bot:0.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 8011
              name: management
          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  key: SPRING_PROFILES_ACTIVE
                  name: app-config
            - name: APP_TELEGRAM_TOKEN
              valueFrom:
                secretKeyRef:
                  name: linktracker-secrets
                  key: APP_TELEGRAM_TOKEN
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
            - name: POSTGRES_DB
              value: postgres
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-0.kafka-hs:9092,kafka-1.kafka-hs:9092,kafka-2.kafka-hs:9092"
            - name: SPRING_REDIS_CLUSTER_NODES
              value: "valkey-0.valkey-hs:6379,valkey-1.valkey-hs:6379,valkey-2.valkey-hs:6379,valkey-3.valkey-hs:6379,valkey-4.valkey-hs:6379,valkey-5.valkey-hs:6379"
---
apiVersion: v1
kind: Service
metadata:
  name: bot-svc
  labels:
    app: linktracker-bot
spec:
  type: NodePort
  selector:
    app: linktracker-bot
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
      name: http
    - port: 8011
      targetPort: 8011
      nodePort: 30011
      name: management
