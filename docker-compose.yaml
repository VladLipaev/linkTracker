name: link-tracker
services:
  postgresql:
    container_name: link-tracker-db
    volumes:
      - ./my_db_files:/var/lib/postgresql/data
    image: postgres:17
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    restart: unless-stopped
    command:
      - "postgres"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "wal_level=logical"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - linktracker

  liquibase-migrations:
    networks:
      - linktracker
    container_name: lt_migrations
    image: liquibase/liquibase:4.29
    depends_on:
      postgresql:
        condition: service_healthy
    command:
      - --log-level=debug
      - --searchPath=/changesets
      - --changelog-file=db.changelog-master.xml
      - --driver=org.postgresql.Driver
      - --url=jdbc:postgresql://postgresql:5432/postgres
      - --username=postgres
      - --password=postgres
      - update
    volumes:
      - ./scrapper/src/main/resources/migrations:/changesets
  zookeeper:
    networks:
      - linktracker
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  broker-1:
    networks:
      - linktracker
    image: confluentinc/cp-kafka:7.5.0
    container_name: broker-1
    depends_on:
      - zookeeper
    ports:
      - "19092:19092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker-1:9092,EXTERNAL://localhost:19092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3

  broker-2:
    networks:
      - linktracker
    image: confluentinc/cp-kafka:7.5.0
    container_name: broker-2
    depends_on:
      - zookeeper
    ports:
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker-2:9092,EXTERNAL://localhost:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3

  broker-3:
    networks:
      - linktracker
    image: confluentinc/cp-kafka:7.5.0
    container_name: broker-3
    depends_on:
      - zookeeper
    ports:
      - "39092:39092"
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:39092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker-3:9092,EXTERNAL://localhost:39092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3

  schema-registry:
    networks:
      - linktracker
    image: confluentinc/cp-schema-registry:7.5.0
    container_name: schema-registry
    ports:
      - "9093:9093"
    environment:
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: broker-1:9092,broker-2:9092,broker-3:9092
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:9093
    depends_on:
      - broker-1
      - broker-2
      - broker-3

  kafka-ui:
    networks:
      - linktracker
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8089:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=Local-Cluster
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=broker-1:9092,broker-2:9092,broker-3:9092
      - KAFKA_CLUSTERS_0_SCHEMAREGISTRY=http://schema-registry:9093
    depends_on:
      - broker-1
      - broker-2
      - broker-3

  valkey-node-1:
    networks:
      - linktracker
    image: valkey/valkey:latest
    container_name: valkey-node-1
    ports:
      - "7001:7001"
    command: [ "valkey-server", "--port", "7001", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes" ]
    volumes:
      - valkey-data-1:/data

  valkey-node-2:
    networks:
      - linktracker
    image: valkey/valkey:latest
    container_name: valkey-node-2
    ports:
      - "7002:7002"
    command: [ "valkey-server", "--port", "7002", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes" ]
    volumes:
      - valkey-data-2:/data

  valkey-node-3:
    networks:
      - linktracker
    image: valkey/valkey:latest
    container_name: valkey-node-3
    ports:
      - "7003:7003"
    command: [ "valkey-server", "--port", "7003", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes" ]
    volumes:
      - valkey-data-3:/data

  valkey-node-4:
    networks:
      - linktracker
    image: valkey/valkey:latest
    container_name: valkey-node-4
    ports:
      - "7004:7004"
    command: [ "valkey-server", "--port", "7004", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes" ]
    volumes:
      - valkey-data-4:/data

  valkey-node-5:
    networks:
      - linktracker
    image: valkey/valkey:latest
    container_name: valkey-node-5
    ports:
      - "7005:7005"
    command: [ "valkey-server", "--port", "7005", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes" ]
    volumes:
      - valkey-data-5:/data

  valkey-node-6:
    networks:
      - linktracker
    image: valkey/valkey:latest
    container_name: valkey-node-6
    ports:
      - "7006:7006"
    command: [ "valkey-server", "--port", "7006", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes" ]
    volumes:
      - valkey-data-6:/data



  valkey-cluster-init:
    networks:
      - linktracker
    image: valkey/valkey:latest
    container_name: valkey-cluster-init
    depends_on:
      - valkey-node-1
      - valkey-node-2
      - valkey-node-3
      - valkey-node-4
      - valkey-node-5
      - valkey-node-6
    command: >
      sh -c "echo 'Ждем 10 секунд для запуска всех нод...' && sleep 10 &&
      echo 'Инициализация кластера...' &&
      valkey-cli --cluster create
      $$(getent hosts valkey-node-1 | awk '{ print $$1 }'):7001
      $$(getent hosts valkey-node-2 | awk '{ print $$1 }'):7002
      $$(getent hosts valkey-node-3 | awk '{ print $$1 }'):7003
      $$(getent hosts valkey-node-4 | awk '{ print $$1 }'):7004
      $$(getent hosts valkey-node-5 | awk '{ print $$1 }'):7005
      $$(getent hosts valkey-node-6 | awk '{ print $$1 }'):7006
      --cluster-replicas 1 --cluster-yes || echo 'Кластер уже инициализирован!'"
  scrapper:
    build:
      dockerfile: Dockerfile
      args:
        JAR_FILE: scrapper/target/scrapper-0.0.1-exec.jar
      tags:
        - localhost:5000/linktracker/scrapper:0.0.1
    container_name: scrapper
    ports:
      - "8081:8081"
      - "8012:8012"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      STACKOVERFLOW_KEY: ${STACKOVERFLOW_KEY}
      STACKOVERFLOW_ACCESS_KEY: ${STACKOVERFLOW_ACCESS_KEY}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      SPRING_PROFILES_ACTIVE: docker
      MANAGEMENT_TRACING_ENABLED: true
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: 1.0
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://jaeger-linktracker:4318/v1/traces
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_TRANSPORT: http
    depends_on:
      - jaeger-linktracker
      - valkey-cluster-init
      - postgresql
      - broker-1
      - broker-2
      - broker-3
    networks:
      - linktracker
  pushgateway:
    networks:
      - linktracker
    image: prom/pushgateway:latest
    container_name: pushgateway
    ports:
      - "9091:9091"
  bot:
    build:
      dockerfile: Dockerfile
      args:
        JAR_FILE: bot/target/bot-0.0.1-exec.jar
      tags:
        - localhost:5000/linktracker/bot:0.0.1
    container_name: bot
    ports:
      - "8080:8080"
      - "8011:8011"
    environment:
      APP_TELEGRAM_TOKEN: ${APP_TELEGRAM_TOKEN}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      SPRING_PROFILES_ACTIVE: docker
      MANAGEMENT_TRACING_ENABLED: true
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: 1.0
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://jaeger-linktracker:4318/v1/traces
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_TRANSPORT: http
    depends_on:
      - jaeger-linktracker
      - postgresql
      - scrapper
      - broker-1
      - broker-2
      - broker-3
    networks:
      - linktracker
  ai-agent:
    build:
      dockerfile: Dockerfile
      args:
        JAR_FILE: ai-agent/target/ai-agent-0.0.1-exec.jar
      tags:
        - localhost:5000/linktracker/ai-agent:0.0.1
    container_name: ai-agent
    ports:
      - "8082:8082"
      - "8013:8013"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      YANDEXGPT_API_KEY: ${YANDEXGPT_API_KEY}
      YANDEXGPT_FOLDER_ID: ${YANDEXGPT_FOLDER_ID}
      MANAGEMENT_TRACING_ENABLED: true
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: 1.0
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://jaeger-linktracker:4318/v1/traces
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_TRANSPORT: http
    depends_on:
      - postgresql
      - broker-1
      - broker-2
      - broker-3
    networks:
      - linktracker
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - linktracker

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
    networks:
      - linktracker

  jaeger-linktracker:
    networks:
      - linktracker
    image: jaegertracing/all-in-one:latest
    container_name: jaeger-linktracker
    ports:
      - "16686:16686"
      - "4318:4318"

    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: memory
    restart: unless-stopped

  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: elasticsearch_linktracker
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
      - xpack.monitoring.collection.enabled=true
      - "cluster.name=linktracker-elk"
    ports:
      - "${ELASTICSEARCH_PORT}:9200"  # HTTP API
      - "9300:9300"  # Transport protocol
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    restart: unless-stopped
    networks:
      - linktracker
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Elasticsearch Exporter для мониторинга в Prometheus
  elasticsearch-exporter:
    image: prometheuscommunity/elasticsearch-exporter:latest
    container_name: elasticsearch_exporter_linktracker
    command:
      - '--es.uri=http://elasticsearch:9200'
      - '--es.all'                 # Собирать метрики со всех нод
      - '--es.indices'             # Собирать метрики по индексам
      - '--es.indices_settings'    # Собирать настройки индексов
      - '--es.shards'              # Собирать метрики по шардам
    ports:
      - "9114:9114"
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - linktracker

  logstash:
    image: logstash:8.11.0
    container_name: logstash_linktracker
    ports:
      - "${LOGSTASH_PORT}:5000"   # TCP input для логов
      - "9600:9600"               # Monitoring API
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
    environment:
      LS_JAVA_OPTS: "-Xms256m -Xmx256m"
      # Параметры подключения к Elasticsearch
      ELASTICSEARCH_HOSTS: "http://${ELASTICSEARCH_HOST}:${ELASTICSEARCH_PORT}"
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - linktracker

  kibana:
    image: kibana:8.11.0
    container_name: kibana_linktracker
    ports:
      - "${KIBANA_PORT}:5601"
    environment:
      ELASTICSEARCH_HOSTS: "http://${ELASTICSEARCH_HOST}:${ELASTICSEARCH_PORT}"
      # Локализация
      I18N_LOCALE: ru
      # Настройки по умолчанию
      KIBANA_DEFAULT_APP_ID: discover
      SERVER_NAME: kibana_linktracker
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - linktracker

  # Опционально: Filebeat для сбора логов из файлов (альтернатива TCP)
  filebeat:
    image: elastic/filebeat:8.11.0
    container_name: filebeat_linktracker
    user: root
    volumes:
      # Конфигурация Filebeat
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      # Docker socket для чтения логов контейнеров
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Логи Docker
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: [ "--strict.perms=false" ]
    depends_on:
      elasticsearch:
        condition: service_healthy
      logstash:
        condition: service_started
    restart: unless-stopped
    networks:
      - linktracker

  connect:
    image: debezium/connect:2.5
    container_name: debezium-connect
    ports:
      - "8099:8083"
    environment:
      BOOTSTRAP_SERVERS: broker-1:9092,broker-2:9092,broker-3:9092
      GROUP_ID: "connect-cluster"
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      # Конвертер для значения сообщений в Kafka (тоже JSON)
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      # Конвертер для внутренних сообщений Connect (например, для оффсетов) – также JSON
      INTERNAL_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      INTERNAL_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter

      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_PLUGIN_PATH: /kafka/connect
    depends_on:
      - broker-1
      - broker-2
      - broker-3
      - postgresql
    networks:
      - linktracker




networks:
  linktracker:
    driver: bridge
volumes:
  valkey-data-1:
  valkey-data-2:
  valkey-data-3:
  valkey-data-4:
  valkey-data-5:
  valkey-data-6:
  grafana-storage:
  elasticsearch_data:
  filebeat_data:
